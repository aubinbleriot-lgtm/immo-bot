<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immo Bot — Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f8f9fa; color: #1a1a1a; }
  header { background: #1d4ed8; color: white; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  header nav a { color: rgba(255,255,255,.8); text-decoration: none; margin-left: 1.5rem; font-size: .9rem; }
  header nav a:hover { color: white; }
  .stats-bar { display: flex; gap: 1rem; padding: 1rem 2rem; background: white; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  .stat { background: #f3f4f6; border-radius: 8px; padding: .6rem 1.2rem; font-size: .85rem; }
  .stat strong { font-size: 1.3rem; display: block; }
  .filters { padding: .8rem 2rem; background: white; border-bottom: 1px solid #e5e7eb; display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input { padding: .4rem .8rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .85rem; }
  .filters label { font-size: .85rem; color: #6b7280; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; padding: 1.5rem 2rem; }
  .card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; padding: 1rem 1.2rem; position: relative; }
  .card:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(29,78,216,.1); }
  .card-score { position: absolute; top: 1rem; right: 1rem; font-size: 1.4rem; font-weight: 700; }
  .s-green  { color: #16a34a; }
  .s-amber  { color: #d97706; }
  .s-gray   { color: #9ca3af; }
  .card-source { font-size: .7rem; background: #f3f4f6; padding: 2px 7px; border-radius: 10px; color: #6b7280; display: inline-block; margin-bottom: .5rem; }
  .card-title { font-size: .95rem; font-weight: 600; margin-bottom: .4rem; line-height: 1.3; padding-right: 3.5rem; }
  .card-meta { font-size: .8rem; color: #6b7280; margin-bottom: .6rem; }
  .card-verdict { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-bottom: .6rem; }
  .v-PÉPITE         { background: #dcfce7; color: #14532d; }
  .v-TRÈS\ INTÉRESSANT { background: #dbeafe; color: #1e3a8a; }
  .v-À\ SURVEILLER  { background: #fef9c3; color: #713f12; }
  .v-MOYEN          { background: #f3f4f6; color: #6b7280; }
  .v-À\ ÉVITER      { background: #fee2e2; color: #7f1d1d; }
  .card-resume { font-size: .82rem; color: #374151; margin-bottom: .8rem; line-height: 1.4; }
  .card-pts { font-size: .78rem; margin-bottom: .8rem; }
  .card-pts li { margin-left: 1rem; margin-bottom: .2rem; }
  .card-pts .pt-ok   { color: #16a34a; }
  .card-pts .pt-warn { color: #d97706; }
  .card-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .8rem; }
  .btn { font-size: .78rem; padding: 4px 10px; border-radius: 6px; border: 1px solid #d1d5db; background: white; cursor: pointer; text-decoration: none; color: #1a1a1a; }
  .btn:hover { background: #f3f4f6; }
  .btn-primary { background: #1d4ed8; color: white; border-color: #1d4ed8; }
  .btn-primary:hover { background: #1e40af; }
  .geo-pill { font-size: .72rem; background: #eff6ff; color: #1e40af; padding: 2px 6px; border-radius: 10px; display: inline-block; margin-right: 4px; }
  .rdt-pill { font-size: .72rem; background: #f0fdf4; color: #14532d; padding: 2px 6px; border-radius: 10px; display: inline-block; }
  #loading { text-align: center; padding: 3rem; color: #9ca3af; }
</style>
</head>
<body>

<header>
  <h1>🏠 Immo Bot</h1>
  <nav>
    <a href="/">Tableau</a>
    <a href="/carte">Carte</a>
  </nav>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat"><strong id="s-total">–</strong>annonces</div>
  <div class="stat"><strong id="s-scores">–</strong>scorées</div>
  <div class="stat"><strong id="s-top">–</strong>top du jour (≥60)</div>
</div>

<div class="filters">
  <label>Source
    <select id="f-source" onchange="charger()">
      <option value="">Toutes</option>
      <option value="leboncoin">LeBonCoin</option>
      <option value="bienici">Bien'ici</option>
      <option value="seloger">SeLoger</option>
      <option value="pap">PAP</option>
      <option value="figaro">Figaro</option>
    </select>
  </label>
  <label>Score min
    <input type="number" id="f-score" value="0" min="0" max="100" style="width:70px" onchange="charger()">
  </label>
  <label>Recherche
    <select id="f-recherche" onchange="charger()">
      <option value="">Toutes</option>
      <option value="locatif_grenoble">Locatif Grenoble</option>
      <option value="locatif_lyon">Locatif Lyon</option>
      <option value="locatif_clermont">Locatif Clermont</option>
      <option value="residence_isere">Résidence Isère</option>
    </select>
  </label>
</div>

<div id="grid" class="grid"><div id="loading">Chargement…</div></div>

<script>
async function charger() {
  document.getElementById("loading") && (document.getElementById("grid").innerHTML = '<div id="loading">Chargement…</div>');
  const source   = document.getElementById("f-source").value;
  const minScore = document.getElementById("f-score").value;
  const recherche= document.getElementById("f-recherche").value;

  const [dataAnn, dataStats] = await Promise.all([
    fetch(`/api/annonces?source=${source}&min_score=${minScore}&recherche=${recherche}&limite=120`).then(r=>r.json()),
    fetch("/api/stats").then(r=>r.json()),
  ]);

  // Stats
  const total = Object.values(dataStats.statuts).reduce((a,b)=>a+b, 0);
  const scores = (dataStats.statuts.score||0) + (dataStats.statuts.alerte||0) + (dataStats.statuts.rapporte||0);
  document.getElementById("s-total").textContent = total;
  document.getElementById("s-scores").textContent = scores;
  document.getElementById("s-top").textContent = dataStats.top_jour;

  // Grille
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if (!dataAnn.length) { grid.innerHTML = '<p style="color:#9ca3af;padding:2rem">Aucune annonce avec ces filtres.</p>'; return; }

  dataAnn.forEach(a => {
    const score = a.score_final ?? null;
    const sClass = score >= 70 ? "s-green" : score >= 50 ? "s-amber" : "s-gray";
    const verdict = a.verdict || "";
    const vClass  = "v-" + verdict;

    const pf = (a.points_forts || []).slice(0,2).map(p=>`<li class="pt-ok">✅ ${p}</li>`).join("");
    const pv = (a.points_vigilance || []).slice(0,1).map(p=>`<li class="pt-warn">⚠️ ${p}</li>`).join("");

    const prix   = a.prix ? a.prix.toLocaleString("fr-FR") + " €" : "N/A";
    const surf   = a.surface ? `${a.surface} m²` : "";
    const pm2    = a.prix_m2 ? `${Math.round(a.prix_m2).toLocaleString("fr-FR")} €/m²` : "";
    const campus = a.dist_campus_km ? `🎓 ${a.dist_campus_km} km` : "";
    const rdt    = a.rendement_brut ? `📈 ${a.rendement_brut}% brut` : "";

    grid.innerHTML += `
    <div class="card">
      ${score !== null ? `<span class="card-score ${sClass}">${score}</span>` : ""}
      <span class="card-source">${(a.source||"").toUpperCase()}</span>
      ${verdict ? `<span class="card-verdict ${vClass}">${verdict}</span>` : ""}
      <div class="card-title">${esc(a.titre)}</div>
      <div class="card-meta">📍 ${esc(a.ville||"")} &nbsp;|&nbsp; 💰 ${prix} &nbsp;|&nbsp; ${surf} &nbsp;|&nbsp; ${pm2}</div>
      ${campus ? `<span class="geo-pill">${campus}</span>` : ""}
      ${rdt    ? `<span class="rdt-pill">${rdt}</span>` : ""}
      ${a.dpe  ? `<span class="geo-pill">DPE ${a.dpe}</span>` : ""}
      ${a.resume_ia ? `<p class="card-resume" style="margin-top:.6rem">${esc(a.resume_ia)}</p>` : ""}
      ${pf||pv ? `<ul class="card-pts">${pf}${pv}</ul>` : ""}
      <div class="card-actions">
        <a class="btn btn-primary" href="${a.url}" target="_blank">Voir l'annonce →</a>
        <button class="btn" onclick="setStatut('${a.id}','a_appeler')">📞 À appeler</button>
        <button class="btn" onclick="setStatut('${a.id}','a_visiter')">🏠 À visiter</button>
        <button class="btn" onclick="setStatut('${a.id}','rejeté')">✕ Rejeter</button>
      </div>
    </div>`;
  });
}

async function setStatut(id, statut) {
  await fetch(`/api/annonce/${id}/statut`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({statut}),
  });
  charger();
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

charger();
</script>
</body>
</html>
