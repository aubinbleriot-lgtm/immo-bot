name: Immo Bot — Collecte quotidienne

on:
  schedule:
    - cron: '0 7 * * *'    # chaque matin à 7h UTC (9h Paris)
  workflow_dispatch:        # déclenchement manuel depuis GitHub

permissions:
  contents: write

# Un seul run à la fois — jamais deux collectes parallèles
concurrency:
  group: immo-bot-scrape
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances Python
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Installer Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Lancer le bot
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          SENDGRID_API_KEY:   ${{ secrets.SENDGRID_API_KEY }}
        run: python run_scrape.py

      - name: Sauvegarder annonces.db
        run: |
          git config --global user.email "immo-bot@github-actions"
          git config --global user.name  "Immo Bot"
          # Sauvegarder nos nouvelles données
          cp annonces.db /tmp/annonces_new.db
          # Récupérer le dernier état du remote
          git fetch origin main
          git reset --hard origin/main
          # Restaurer nos données par-dessus
          cp /tmp/annonces_new.db annonces.db
          git add annonces.db
          git diff --staged --quiet || \
            git commit -m "chore: collecte quotidienne $(date -u +%Y-%m-%d) [skip ci]"
          # --force-with-lease : push forcé sécurisé
          # Échoue seulement si le remote a bougé APRÈS notre fetch ci-dessus
          # (cas quasi-impossible en pratique, le bot est le seul à écrire db)
          git push --force-with-lease