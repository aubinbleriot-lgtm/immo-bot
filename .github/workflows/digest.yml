name: Immo Bot — Digest quotidien

on:
  schedule:
    - cron: '0 18 * * *'   # 18h UTC = 20h Paris — après la collecte du matin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immo-bot-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        run: |
          pip install requests sendgrid google-genai python-dotenv

      - name: Envoyer le digest
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python run_digest.py

      - name: Sauvegarder statuts
        run: |
          git config --global user.email "immo-bot@github-actions"
          git config --global user.name  "Immo Bot"
          git add annonces.db
          git diff --staged --quiet || \
            git commit -m "chore: digest $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push
