name: Immo Bot — Digest quotidien

on:
  schedule:
    - cron: '0 7 * * *'    # chaque matin à 7h UTC (9h Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        run: pip install -r requirements.txt

      - name: Envoyer le digest du jour
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python run_digest.py

      - name: Commit statuts mis à jour
        run: |
          git config --global user.email "immo-bot@github-actions"
          git config --global user.name  "Immo Bot"
          git add annonces.db || true
          git diff --staged --quiet || \
            git commit -m "chore: digest quotidien [skip ci]"
          git push
